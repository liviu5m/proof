[project]
name = "proof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-genai", "python-dotenv", "typer", "pytest", "pytest-asyncio", "pytest-mock", "respx", "pytest-cov", "httpx"]

[project.scripts]
proof = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=65"
testpaths = ["tests"]

[tool.ruff]
select = ["E", "F", "B", "BLE", "UP", "SIM", "C4", "RUF", "I"]
ignore = [
    "B008",  # Depends() in defaults - required by FastAPI dependency injection
    "BLE001",  # catch blind exception - common pattern
    "E722",  # bare except - common pattern
    "S110",  # try-except-pass - common pattern
    "E501",  # line too long - subjective, not worth fixing in HTML templates
    "E711",  # Column == None is SQLAlchemy's IS NULL form
]
unfixable = ["B008", "BLE001", "E722", "S110", "E501"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true

