[project]
name = "proof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-genai", "python-dotenv", "typer", "pytest", "pytest-asyncio", "pytest-mock", "respx", "pytest-cov", "httpx"]

[project.scripts]
proof = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "alembic",
]
