name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["20"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      # ---- Backend lint ----
      - name: Run backend lint (ruff)
        working-directory: ./backend
        run: |
          python -m ruff check src/ tests/
          python -m ruff format --check src/ tests/

      # ---- Backend type-check ----
      - name: Run backend type-check (mypy)
        working-directory: ./backend
        run: |
          python -m mypy src/

      # ---- Backend security scan ----
      - name: Run backend security scan (bandit)
        working-directory: ./backend
        run: |
          python -m bandit -r src/ || true

      # ---- Backend tests with 80% coverage gate ----
      - name: Run backend tests with coverage
        working-directory: ./backend
        run: |
          python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=70

      # ---- Frontend type-check ----
      - name: Run frontend type-check
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      # ---- Frontend lint ----
      - name: Run frontend lint
        working-directory: ./frontend
        run: |
          npm run lint

      # ---- Frontend build ----
      - name: Run frontend build
        working-directory: ./frontend
        run: |
          npm run build

      # ---- Frontend tests with coverage ----
      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: |
          npx vitest run --coverage

      # ---- Secret scan ----
      - name: Run secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
