name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: test-key
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key
      ENVIRONMENT: testing
      LOG_LEVEL: DEBUG
      MAX_CONCURRENT_RUNS: 5
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OLLAMA_BASE_URL: http://localhost:11434
      ENCRYPTION_KEY: P8D_OWN_U4xHXwD_yuKjC1QDe0j2Bbfwhr427rQcOG8=
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      FRONTEND_URL: http://localhost:3000
      REDIRECT_URI: http://localhost:3000/auth/callback
      RESEND_API_KEY: ""
      BREVO_API_KEY: ""
      FROM_EMAIL: noreply@localhost
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["26"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      # ---- Backend lint ----
      - name: Run backend lint (ruff)
        working-directory: ./backend
        run: |
          python -m ruff check src/ tests/
          python -m ruff format --check src/ tests/

      # ---- Backend security scan ----
      - name: Run backend security scan (bandit)
        working-directory: ./backend
        run: |
          python -m bandit -r src/ || true

      # ---- Backend tests with 70% coverage gate ----
      - name: Run backend tests with coverage
        working-directory: ./backend
        run: |
          python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=65

      # ---- Frontend type-check ----
      - name: Run frontend type-check
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      # ---- Frontend lint ----
      - name: Run frontend lint
        working-directory: ./frontend
        run: |
          npm run lint

      # ---- Frontend build ----
      - name: Run frontend build
        working-directory: ./frontend
        run: |
          npm run build

      # ---- Frontend tests with coverage ----
      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: |
          npx vitest run --coverage

      # ---- Secret scan ----
      - name: Run secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
